appId: in.studyassistant.app
productName: StudyAssistant
directories:
  output: release
files:
  - dist/**
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
