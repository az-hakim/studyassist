# Supabase CLI configuration. Run `supabase start` for a local stack.
project_id = "studybuddy"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/#/app",
  "http://127.0.0.1:5173/#/app",
  "com.azhakim.studybuddy://auth-callback",
  "http://127.0.0.1:53682/auth-callback",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"

[functions.chat]
verify_jwt = true

[functions.quiz-generate]
verify_jwt = true

[functions.quiz-grade]
verify_jwt = true

[functions.flashcards-generate]
verify_jwt = true

[functions.plan-generate]
verify_jwt = true

[functions.lesson-generate]
verify_jwt = true

[functions.embed-file]
verify_jwt = true

[functions.web-search]
verify_jwt = true
