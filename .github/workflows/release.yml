name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Zip launcher
        run: |
          cd apps/web/dist
          zip -r "$GITHUB_WORKSPACE/StudyAssistant-${{ github.ref_name }}-web.zip" .
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: StudyAssistant-*-web.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build installer
        run: pnpm --filter @studyassistant/desktop dist
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Report signature state
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/release/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($sig.Status)"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: apps/desktop/release/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          # Google no longer serves the legacy `tools` package (v3 installed it and failed).
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Generate Android project
        run: pnpm --filter @studyassistant/android add:platform
      - name: Configure Android project
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # The release version comes from the tag, like every other artifact name.
          version="${GITHUB_REF_NAME#v}"
          args=(--version "$version")
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret: falling back to the debug-signed APK." >> "$GITHUB_STEP_SUMMARY"
          else
            for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
              if [ -z "${!name}" ]; then
                echo "::error::$name must be set when ANDROID_KEYSTORE_BASE64 is set."
                exit 1
              fi
            done
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            args+=(--keystore "$RUNNER_TEMP/release.jks"
              --store-password "$ANDROID_KEYSTORE_PASSWORD"
              --key-alias "$ANDROID_KEY_ALIAS"
              --key-password "$ANDROID_KEY_PASSWORD")
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
          node apps/android/scripts/configure-android-project.mjs "${args[@]}"
      - name: Build release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: apps/android/android
        run: ./gradlew assembleRelease
      - name: Build debug APK
        if: steps.signing.outputs.enabled != 'true'
        working-directory: apps/android/android
        run: ./gradlew assembleDebug
      - name: Collect APK
        id: apk
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            source_apk=apps/android/android/app/build/outputs/apk/release/app-release.apk
          else
            source_apk=apps/android/android/app/build/outputs/apk/debug/app-debug.apk
          fi
          test -f "$source_apk"
          # Same naming as the installer: StudyAssistant-Setup-<version>.exe.
          apk="StudyAssistant-$version.apk"
          cp "$source_apk" "$apk"
          echo "apk=$GITHUB_WORKSPACE/$apk" >> "$GITHUB_OUTPUT"
          apksigner=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | head -n 1)
          "$apksigner" verify --print-certs "$apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: ${{ steps.apk.outputs.apk }}

  release:
    needs: [web, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          # Tags like v0.2.0-rc.1 are pre-releases; plain v0.2.0 is a stable release.
          prerelease: ${{ contains(github.ref_name, '-') }}
