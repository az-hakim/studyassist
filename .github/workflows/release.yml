name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Zip launcher
        run: |
          cd apps/web/dist
          zip -r "$GITHUB_WORKSPACE/StudyAssistant-${{ github.ref_name }}-web.zip" .
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: StudyAssistant-*-web.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build installer
        run: pnpm --filter @studyassistant/desktop dist
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Report signature state
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/release/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($sig.Status)"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: apps/desktop/release/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          # Google no longer serves the legacy `tools` package (v3 installed it and failed).
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Generate Android project
        run: pnpm --filter @studyassistant/android add:platform
      - name: Build APK
        working-directory: apps/android/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: apps/android/android/app/build/outputs/apk/debug/*.apk

  release:
    needs: [web, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          # Tags like v0.2.0-rc.1 are pre-releases; plain v0.2.0 is a stable release.
          prerelease: ${{ contains(github.ref_name, '-') }}
